<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STAR-lj AI 維修視覺化分析系統</title>
    <!-- 引入樣式庫與圖表庫 -->
    <style>
        body { font-family: "Segoe UI", Arial, sans-serif; background: #f4f6f9; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 1100px; margin: 0 auto; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #0066cc; padding-bottom: 10px; margin-bottom: 20px; }
        .upload-zone { border: 2px dashed #0066cc; padding: 30px; text-align: center; background: #f0f7ff; border-radius: 8px; cursor: pointer; }
        .btn { background: #0066cc; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-size: 14px; }
        .btn:hover { background: #004c99; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .ai-box { background: #f8f9fa; border-left: 4px solid #0066cc; padding: 15px; border-radius: 0 8px 8px 0; font-size: 15px; line-height: 1.6; white-space: pre-line; }
        input[type="text"] { width: 300px; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
    </style>
    <!-- 1. SheetJS (讀取 Excel) -->
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    <!-- 2. Chart.js (繪製圖表) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>◈ STAR-lj 維修視覺化 & AI 診斷系統</h2>
        <div>
            <label>Gemini API Key: </label>
            <input type="password" id="apiKey" placeholder="貼上免費的 Gemini API Key">
        </div>
    </div>

    <!-- 上傳區塊 -->
    <div class="card">
        <div class="upload-zone" onclick="document.getElementById('excelFile').click()">
            📊 <b>點擊上傳月度維修報表 (.xlsx / .xls)</b>
            <p style="color: #666; font-size: 13px; margin-top: 5px;">資料直接在您的瀏覽器本機端解析，不需傳送至外部伺服器儲存</p>
            <input type="file" id="excelFile" accept=".xlsx, .xls" style="display:none">
        </div>
        <div id="statusMsg" style="margin-top: 10px; font-weight: bold; text-align: center;"></div>
    </div>

    <!-- 分析結果區域 (預設隱藏) -->
    <div id="dashboard" style="display: none;">
        
        <!-- AI 智慧主管摘要 -->
        <div class="card">
            <h3>💡 AI 品質工程師 - 主管摘要與改善建議</h3>
            <div id="aiSummary" class="ai-box">正在等待 AI 分析數據...</div>
        </div>

        <!-- 圖表分析區 -->
        <div class="grid-2">
            <div class="card">
                <h3>❖ 機種故障件數排名 TOP 5</h3>
                <canvas id="modelChart"></canvas>
            </div>
            <div class="card">
                <h3>🧩 主要更換零件 Pareto 分布</h3>
                <canvas id="partChart"></canvas>
            </div>
        </div>
    </div>
</div>

<script>
let modelChartInst = null;
let partChartInst = null;

// 監聽 Excel 上傳
document.getElementById('excelFile').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;

    document.getElementById('statusMsg').innerText = "⏳ 正在讀取並解析 Excel...";
    
    const reader = new FileReader();
    reader.onload = async function(event) {
        try {
            const data = new Uint8Array(event.target.result);
            const workbook = XLSX.read(data, { type: 'array' });
            
            // 讀取第一個工作表
            const sheet = workbook.Sheets[workbook.SheetNames[0]];
            const jsonData = XLSX.utils.sheet_to_json(sheet);

            if (jsonData.length === 0) {
                alert("Excel 內沒有發現數據！");
                return;
            }

            document.getElementById('statusMsg').innerText = `✅ 成功讀取 ${jsonData.length} 筆維修紀錄！`;
            document.getElementById('dashboard').style.display = 'block';

            // 1. 本地端資料統計與視覺化
            processLocalAnalysis(jsonData);

            // 2. 呼叫 AI 進行進階診斷
            const apiKey = document.getElementById('apiKey').value.trim();
            if (apiKey) {
                callGeminiAI(jsonData, apiKey);
            } else {
                document.getElementById('aiSummary').innerText = "💡 請在上方的「Gemini API Key」輸入框貼上 Key，即可自動解鎖 AI 品質工程師的主管摘要與 CAPA 改善建議！";
            }

        } catch (err) {
            console.error(err);
            alert("Excel 解析失敗，請檢查欄位格式。");
        }
    };
    reader.readAsArrayBuffer(file);
});

// 統計數據並繪製圖表
function processLocalAnalysis(data) {
    // 假設 Excel 欄位包含「機種」與「零件名稱」(可依實際 Excel 欄位名稱自動彈性調整)
    const modelCounts = {};
    const partCounts = {};

    data.forEach(row => {
        // 尋找可能的欄位名稱
        const model = row['機種'] || row['型號'] || row['Model'] || '未知機種';
        const part = row['零件名稱'] || row['零件'] || row['故障零件'] || row['Part'] || '未知零件';

        modelCounts[model] = (modelCounts[model] || 0) + 1;
        partCounts[part] = (partCounts[part] || 0) + 1;
    });

    // 排序取得 TOP 5
    const topModels = Object.entries(modelCounts).sort((a,b) => b[1] - a[1]).slice(0, 5);
    const topParts = Object.entries(partCounts).sort((a,b) => b[1] - a[1]).slice(0, 5);

    // 繪製機種圖表
    renderChart('modelChart', 'bar', topModels.map(x=>x[0]), topModels.map(x=>x[1]), '維修件數', '#0066cc');
    // 繪製零件圖表
    renderChart('partChart', 'doughnut', topParts.map(x=>x[0]), topParts.map(x=>x[1]), '更換數量', ['#ff6384', '#36a2eb', '#cc65fe', '#ffce56', '#4bc0c0']);
}

function renderChart(canvasId, type, labels, data, labelName, colors) {
    const ctx = document.getElementById(canvasId).getContext('2d');
    if (canvasId === 'modelChart' && modelChartInst) modelChartInst.destroy();
    if (canvasId === 'partChart' && partChartInst) partChartInst.destroy();

    const chartConfig = {
        type: type,
        data: {
            labels: labels,
            datasets: [{
                label: labelName,
                data: data,
                backgroundColor: colors
            }]
        },
        options: { responsive: true, plugins: { legend: { display: type !== 'bar' } } }
    };

    if (canvasId === 'modelChart') modelChartInst = new Chart(ctx, chartConfig);
    if (canvasId === 'partChart') partChartInst = new Chart(ctx, chartConfig);
}

// 呼叫 Gemini API (採動態模型偵測，免除 404 硬編碼問題)
async function callGeminiAI(data, apiKey) {
    const aiBox = document.getElementById('aiSummary');
    aiBox.innerText = "🤖 正在向 Google 查詢您的 Key 可用的 AI 模型...";

    // 精簡欄位，節省 Token 並提升成功率
    const sampleData = data.slice(0, 30).map(item => ({
        機種: item['機種'] || item['型號'] || item['Model'] || '',
        故障原因: item['故障原因'] || item['故障描述'] || item['Reason'] || '',
        零件: item['零件名稱'] || item['零件'] || item['Part'] || ''
    }));

    const prompt = `你是一位專業的安防設備品質與維修分析工程師。以下是本月維修報表採樣數據：
${JSON.stringify(sampleData)}

請依據數據回答以下三點，並用繁體中文簡潔回覆：
1. 【主管摘要】：列出本期最主要的故障機種與核心問題。
2. 【異常偵測與風險警示】：是否有集中於特定零件或不良模式的跡象？
3. 【CAPA 建議行動】：針對高頻故障，提出 2 點品質改善或備料建議。`;

    try {
        // 🔍 階段一：動態向 Google 查詢此 API Key 有權限調用的模型
        let availableModel = null;
        let apiVersion = 'v1beta';

        let listRes = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${apiKey}`, {
            headers: { 'x-goog-api-key': apiKey }
        });

        if (listRes.ok) {
            const listData = await listRes.json();
            if (listData.models && listData.models.length > 0) {
                // 篩選支援文本產生的模型 (generateContent)
                const validModels = listData.models.filter(m => 
                    m.supportedGenerationMethods && m.supportedGenerationMethods.includes('generateContent')
                );
                // 優先選擇 flash 類型，無則選第一個可用模型
                const target = validModels.find(m => m.name.includes('flash')) || validModels[0];
                if (target) availableModel = target.name;
            }
        } else {
            // 若 v1beta 失敗，嘗試 v1 終端
            let listResV1 = await fetch(`https://generativelanguage.googleapis.com/v1/models?key=${apiKey}`, {
                headers: { 'x-goog-api-key': apiKey }
            });
            if (listResV1.ok) {
                apiVersion = 'v1';
                const listDataV1 = await listResV1.json();
                if (listDataV1.models && listDataV1.models.length > 0) {
                    const validModels = listDataV1.models.filter(m => 
                        m.supportedGenerationMethods && m.supportedGenerationMethods.includes('generateContent')
                    );
                    const target = validModels.find(m => m.name.includes('flash')) || validModels[0];
                    if (target) availableModel = target.name;
                }
            }
        }

        // ❌ 若查詢後發現完全沒有任何可用模型
        if (!availableModel) {
            aiBox.innerHTML = `<div style="color: #721c24; background-color: #f8d7da; padding: 12px; border-radius: 6px;">` +
                `<strong>❌ 找不到可用的 AI 模型 (API Key 權限受限)</strong><br><br>` +
                `Google 回傳您的 Key 目前無法存取 Gemini 模型。請依以下步驟重新申請：<br><br>` +
                `1. 請前往 <a href="https://aistudio.google.com/" target="_blank" style="color: #0056b3; font-weight: bold;">Google AI Studio</a>。<br>` +
                `2. 點擊左上角/右上角的 <strong>Get API key</strong>。<br>` +
                `3. 點擊 <strong>Create API key in new project</strong> 建立全新專用金鑰。<br>` +
                `4. 複製新金鑰後貼回本頁面重新測試。` +
                `</div>`;
            return;
        }

        // 🚀 階段二：使用動態找到的模型發送分析請求
        const cleanModelName = availableModel.replace('models/', '');
        aiBox.innerText = `🤖 成功找到可用模型 (${cleanModelName})，AI 品質工程師分析中...`;

        const targetUrl = `https://generativelanguage.googleapis.com/${apiVersion}/models/${cleanModelName}:generateContent?key=${apiKey}`;

        const response = await fetch(targetUrl, {
            method: 'POST',
            headers: { 
                'Content-Type': 'application/json',
                'x-goog-api-key': apiKey 
            },
            body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
        });

        const resData = await response.json();

        if (response.ok && resData.candidates && resData.candidates[0] && resData.candidates[0].content) {
            aiBox.innerText = resData.candidates[0].content.parts[0].text;
        } else if (resData.error) {
            aiBox.innerText = `❌ API 分析失敗 (代碼 ${resData.error.code})：\n${resData.error.message}`;
        } else {
            aiBox.innerText = "⚠️ AI 收到請求但未產生內容，可能被安全過濾器攔截。";
        }

    } catch (err) {
        console.error("連線過程發生錯誤:", err);
        aiBox.innerText = "❌ 網路連線失敗：" + err.message;
    }
}
</script>

</body>
</html>
